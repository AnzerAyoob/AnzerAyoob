<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Featured opinion article by Anzer Ayoob</title>
  <desc id="desc">I Didn’t Want AI to Build My App. I Wanted to Learn How to Build It Myself. Read the essay on AnzerAyoob.com.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset=".55" stop-color="#07111e"/><stop offset="1" stop-color="#190d18"/></linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#101827" stop-opacity="1"/><stop offset=".48" stop-color="#101827" stop-opacity=".96"/><stop offset=".72" stop-color="#101827" stop-opacity=".58"/><stop offset="1" stop-color="#101827" stop-opacity=".08"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb3c58"/><stop offset="1" stop-color="#ff8154"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff526c"/><stop offset=".48" stop-color="#627dff"/><stop offset="1" stop-color="#23d8f2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="clip"><rect x="18" y="18" width="1164" height="404" rx="24"/></clipPath>
  </defs>
  <rect x="25" y="28" width="1150" height="400" rx="27" fill="#f33c62" opacity=".16" filter="url(#shadow)"/>
  <g clip-path="url(#clip)">
    <rect x="18" y="18" width="1164" height="404" rx="24" fill="url(#bg)"/>
    <image href="https://anzerayoob.com/wp-content/uploads/2026/10/20261022_210334-1024x576.jpg" x="420" y="18" width="762" height="404" preserveAspectRatio="xMidYMid slice"/>
    <rect x="18" y="18" width="1164" height="404" fill="url(#veil)"/>
    <path d="M18 330 C190 295 265 360 440 315 S680 330 770 290" fill="none" stroke="#ff9a70" stroke-width="2" opacity=".7"/>
    <path d="M18 342 C190 307 265 372 440 327 S680 342 770 302" fill="none" stroke="#ff4f72" stroke-width="1" opacity=".35"/>
    <rect x="52" y="48" width="190" height="34" rx="17" fill="#e82e4f"/>
    <text x="147" y="70" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1.2">FEATURED OPINION</text>
    <text x="264" y="69" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#c4d0e5" letter-spacing="1.1">OCTOBER 22, 2026  ·  14 MIN READ</text>
    <text x="52" y="137" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" fill="#fff">I Didn’t Want AI to</text>
    <text x="52" y="183" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" fill="#fff">Build My App.</text>
    <text x="52" y="229" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" fill="#ff6477">I Wanted to Learn</text>
    <text x="52" y="275" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" fill="#ff6477">How to Build It Myself.</text>
    <text x="54" y="315" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d8e2f1">Learning software by building real products—</text>
    <text x="54" y="340" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d8e2f1">with AI as a guide, not a substitute for understanding.</text>
    <rect x="52" y="363" width="255" height="39" rx="9" fill="url(#accent)"/>
    <text x="179" y="388" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">READ THE ARTICLE  →</text>
